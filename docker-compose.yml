services:
  
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/bloodbank
      - JWT_SECRET=your_very_strong_jwt_secret_key_at_least_32_characters_long_change_in_production
      - PORT=5000
      - FRONTEND_URL=http://localhost
    depends_on: 
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: